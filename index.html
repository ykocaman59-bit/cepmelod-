<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c29; color: #fff; min-height: 100vh; padding-bottom: 90px; }
        
        header { padding: 25px 20px 10px 20px; text-align: center; font-size: 24px; font-weight: bold; color: #00f2fe; }
        
        .search-area { padding: 15px 20px; display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
        .search-area input { flex: 1; padding: 14px 20px; border-radius: 30px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 15px; outline: none; }
        .search-area input::placeholder { color: #bbb; }
        .search-area button { background: #00f2fe; border: none; color: #0f0c29; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 15px; }

        .container { padding: 15px 20px; max-width: 600px; margin: 0 auto; }
        
        /* Uygulama içi arama sonuç ekranı / Oynatıcı alanı */
        #results-container { display: none; margin-top: 15px; }
        .player-box { background: rgba(255,255,255,0.07); border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        
        /* YouTube embed / iframe alanı */
        iframe { width: 100%; height: 250px; border: none; }

        .welcome-card { background: rgba(255,255,255,0.07); padding: 25px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-top: 15px; }
        .welcome-card h3 { font-size: 18px; margin-bottom: 10px; color: #00f2fe; }
        .welcome-card p { font-size: 14px; color: #ccc; line-height: 1.5; }

        .page { display: none; }
        .page.active { display: block; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #13102b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- ANA SAYFA -->
    <div id="home-page" class="page active">
        <header>🎵 CepMelodi</header>

        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Şarkı veya sanatçı adı yazın...">
            <button onclick="searchInApp()">Bul</button>
        </div>

        <div class="container">
            <!-- Başlangıç Bilgi Kartı -->
            <div id="welcomeCard" class="welcome-card">
                <h3>Uygulama İçi Müzik Keyfi</h3>
                <p>Aradığın şarkıları dışarı çıkmadan, doğrudan bu ekran üzerinden dinleyebilir ve keyfini çıkarabilirsin.</p>
            </div>

            <!-- Uygulama İçi Sonuç / Oynatıcı Alanı -->
            <div id="results-container">
                <div class="player-box">
                    <div id="embedArea"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MÜZİKLERİM -->
    <div id="downloads-page" class="page">
        <header>📂 Müziklerim</header>
        <div class="container">
            <div class="welcome-card">
                <p style="color:#aaa;">Henüz kaydedilen müzik bulunmuyor.</p>
            </div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="nav-home" class="active" onclick="switchTab('home')">
            <span>🏠</span> Ana Sayfa
        </button>
        <button id="nav-downloads" onclick="switchTab('downloads')">
            <span>📂</span> Müziklerim
        </button>
    </nav>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            if(tabName === 'home') {
                document.getElementById('home-page').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
            } else {
                document.getElementById('downloads-page').classList.add('active');
                document.getElementById('nav-downloads').classList.add('active');
            }
        }

        function searchInApp() {
            let query = document.getElementById('searchInput').value.trim();
            if(!query) {
                alert("Lütfen bir şarkı veya sanatçı adı yazın!");
                return;
            }

            // Karşılama kartını gizle, sonuç alanını aç
            document.getElementById('welcomeCard').style.display = 'none';
            let resContainer = document.getElementById('results-container');
            resContainer.style.display = 'block';

            let embedArea = document.getElementById('embedArea');
            
            // Kullanıcıyı dışarı fırlatmak yerine, arama sonuçlarını uygulama içine gömüyoruz
            let targetUrl = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}`;
            
            embedArea.innerHTML = `<iframe src="${targetUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchInApp();
            }
        });
    </script>
</body>
</html>
