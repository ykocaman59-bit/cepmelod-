<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c29; color: #fff; min-height: 100vh; padding-bottom: 90px; }
        
        header { padding: 20px; text-align: center; font-size: 22px; font-weight: bold; color: #00f2fe; }
        
        .search-area { padding: 10px 20px; display: flex; flex-direction: column; gap: 10px; max-width: 600px; margin: 0 auto; }
        .search-row { display: flex; gap: 10px; }
        .search-row input { flex: 1; padding: 12px 20px; border-radius: 30px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 14px; outline: none; }
        .search-row button { background: #00ff88; border: none; color: #0f0c29; padding: 0 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }

        .container { padding: 10px 20px; max-width: 600px; margin: 0 auto; }
        
        .song-card { background: rgba(255,255,255,0.07); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px; }
        .song-title { font-size: 15px; font-weight: bold; color: #00f2fe; }
        
        .btn-download { background: #00ff88; border: none; color: #0f0c29; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; display: block; font-size: 14px; }

        .page { display: none; }
        .page.active { display: block; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #13102b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- ANA SAYFA -->
    <div id="home-page" class="page active">
        <header>🎵 CepMelodi</header>
        <div class="search-area">
            <div class="search-row">
                <input type="text" id="urlInput" placeholder="YouTube şarkı linkini buraya yapıştır...">
                <button onclick="processLink()">Dönüştür & İndir</button>
            </div>
        </div>
        <div class="container" id="resultsList">
            <p style="text-align:center; color:#888; margin-top:30px;">YouTube linkini yapıştırarak MP3 olarak indirin.</p>
        </div>
    </div>

    <!-- MÜZİKLERİM -->
    <div id="downloads-page" class="page">
        <header>📂 İndirilenler</header>
        <div class="container" id="myMusicList">
            <p style="text-align:center; color:#888;">Henüz indirilen müzik yok.</p>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="nav-home" class="active" onclick="switchTab('home')"><span>🏠</span> Ana Sayfa</button>
        <button id="nav-downloads" onclick="switchTab('downloads')"><span>📂</span> İndirilenler</button>
    </nav>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(tabName === 'home') {
                document.getElementById('home-page').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
            } else {
                document.getElementById('downloads-page').classList.add('active');
                document.getElementById('nav-downloads').classList.add('active');
            }
        }

        function extractVideoId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        async function processLink() {
            let url = document.getElementById('urlInput').value.trim();
            let resultsList = document.getElementById('resultsList');
            let videoId = extractVideoId(url);

            if(!videoId) {
                alert("Geçerli bir YouTube linki yapıştırın!");
                return;
            }

            resultsList.innerHTML = "<p style='text-align:center; color:#00f2fe;'>MP3 hazırlanıyor, lütfen bekleyin...</p>";

            try {
                let res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
                let data = await res.json();
                let songTitle = data.title || "Müzik Dosyası";

                // Doğrudan çalışan kararlı kamuya açık mp3 dönüştürme API uç noktası
                let downloadLink = `https://api.vkrp.dev/download?url=https://www.youtube.com/watch?v=${videoId}`;

                resultsList.innerHTML = "";
                addSongCard(songTitle, downloadLink, 'resultsList');
                addSongCard(songTitle, downloadLink, 'myMusicList');

                document.getElementById('urlInput').value = "";
            } catch (err) {
                let fallbackLink = `https://loader.pro/api/download.php?url=https://www.youtube.com/watch?v=${videoId}&format=mp3`;
                resultsList.innerHTML = "";
                addSongCard("YouTube Şarkısı", fallbackLink, 'resultsList');
                addSongCard("YouTube Şarkısı", fallbackLink, 'myMusicList');
            }
        }

        function addSongCard(title, dlLink, targetId) {
            let container = document.getElementById(targetId);
            if(container.innerHTML.includes("Henüz indirilen müzik yok.") || container.innerHTML.includes("YouTube linkini yapıştırarak")) {
                container.innerHTML = "";
            }

            let card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
                <div class="song-title">${title}</div>
                <a class="btn-download" href="${dlLink}" target="_blank">📲 Cihaza MP3 İndir</a>
            `;
            container.appendChild(card);
        }
    </script>
</body>
</html>
