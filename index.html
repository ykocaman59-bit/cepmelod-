<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c29; color: #fff; min-height: 100vh; padding-bottom: 90px; }
        
        header { padding: 30px 20px 10px 20px; text-align: center; font-size: 26px; font-weight: bold; color: #00f2fe; }
        
        .box { padding: 20px; max-width: 500px; margin: 0 auto; text-align: center; }
        
        .search-area { display: flex; gap: 10px; margin-top: 20px; }
        .search-area input { flex: 1; padding: 16px 20px; border-radius: 30px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 16px; outline: none; }
        .search-area input::placeholder { color: #bbb; }
        
        .btn { background: #00f2fe; border: none; color: #0f0c29; padding: 0 25px; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 16px; }

        .card { background: rgba(255,255,255,0.07); padding: 30px 20px; border-radius: 20px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .card h3 { font-size: 20px; margin-bottom: 10px; color: #00f2fe; }
        .card p { font-size: 14px; color: #ccc; margin-bottom: 25px; line-height: 1.6; }
        
        .yt-link { display: inline-block; background: #ff0000; color: #fff; padding: 15px 30px; border-radius: 35px; text-decoration: none; font-weight: bold; font-size: 16px; }

        .page { display: none; }
        .page.active { display: block; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #13102b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- ANA SAYFA -->
    <div id="home-page" class="page active">
        <header>🎵 CepMelodi</header>
        <div class="box">
            <div class="search-area">
                <input type="text" id="q" placeholder="Şarkı veya sanatçı adı...">
                <button class="btn" onclick="go()">Ara</button>
            </div>

            <div class="card">
                <h3>Direk Erişim</h3>
                <p>Arama kutusuna ne yazarsan yaz, takılma veya hata olmadan doğrudan YouTube üzerinden açılır.</p>
                <a href="#" onclick="go(); return false;" class="yt-link">▶️ YouTube'da Aç</a>
            </div>
        </div>
    </div>

    <!-- MÜZİKLERİM -->
    <div id="downloads-page" class="page">
        <header>📂 Müziklerim</header>
        <div class="box">
            <div class="card">
                <p style="color:#aaa;">Kayıtlı müzik bulunmuyor.</p>
            </div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="n1" class="active" onclick="tab('home')">
            <span>🏠</span> Ana Sayfa
        </button>
        <button id="n2" onclick="tab('downloads')">
            <span>📂</span> Müziklerim
        </button>
    </nav>

    <script>
        function tab(t) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            if(t === 'home') {
                document.getElementById('home-page').classList.add('active');
                document.getElementById('n1').classList.add('active');
            } else {
                document.getElementById('downloads-page').classList.add('active');
                document.getElementById('n2').classList.add('active');
            }
        }

        function go() {
            let val = document.getElementById('q').value.trim();
            if(!val) {
                alert("Lütfen bir şeyler yazın!");
                return;
            }
            window.location.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(val);
        }

        document.getElementById('q').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { go(); }
        });
    </script>
</body>
</html>
