<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f0c29; color: #fff; min-height: 100vh; padding-bottom: 90px; }
        
        header { padding: 20px; text-align: center; font-size: 22px; font-weight: bold; color: #00f2fe; }
        
        .search-box { padding: 0 20px; margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 14px 18px; border-radius: 25px; border: none; background: rgba(255,255,255,0.15); color: #fff; font-size: 16px; outline: none; }
        .search-box input::placeholder { color: #bbb; }
        .search-box button { background: #00f2fe; border: none; color: #0f0c29; padding: 0 22px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 15px; }

        .container { padding: 0 20px; }
        .info-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 16px; text-align: center; margin-top: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .info-card h3 { font-size: 18px; margin-bottom: 10px; color: #00f2fe; }
        .info-card p { font-size: 14px; color: #ccc; margin-bottom: 20px; line-height: 1.5; }
        
        .yt-btn { display: inline-block; background: #ff0000; color: #fff; padding: 14px 24px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 16px; box-shadow: 0 4px 15px rgba(255,0,0,0.4); }

        .page { display: none; }
        .page.active { display: block; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #13102b; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 20px; }
    </style>
</head>
<body>

    <!-- 1. ANA SAYFA -->
    <div id="home-page" class="page active">
        <header>🎵 CepMelodi</header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Şarkı veya sanatçı adı yazın...">
            <button onclick="openYouTube()">Bul</button>
        </div>

        <div class="container">
            <div class="info-card">
                <h3>Sınırsız Müzik Keyfi</h3>
                <p>Aradığın tüm yerli, yabancı ve underground şarkılara tek dokunuşla ulaşmak için ismini yaz ve aşağıdaki butona bas.</p>
                <a id="directLink" href="https://www.youtube.com" target="_blank" class="yt-btn">▶️ YouTube'da Ara ve Dinle</a>
            </div>
        </div>
    </div>

    <!-- 2. MÜZİKLERİM -->
    <div id="downloads-page" class="page">
        <header>📂 Müziklerim</header>
        <div class="container">
            <div class="info-card">
                <p style="color:#aaa;">Henüz kaydedilen müzik yok.</p>
            </div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="nav-home" class="active" onclick="switchPage('home')">
            <span>🏠</span> Ana Sayfa
        </button>
        <button id="nav-downloads" onclick="switchPage('downloads')">
            <span>📂</span> Müziklerim
        </button>
    </nav>

    <script>
        function switchPage(pageName) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            
            if(pageName === 'home') {
                document.getElementById('home-page').classList.add('active');
                document.getElementById('nav-home').classList.add('active');
            } else {
                document.getElementById('downloads-page').classList.add('active');
                document.getElementById('nav-downloads').classList.add('active');
            }
        }

        function openYouTube() {
            let query = document.getElementById('searchInput').value.trim();
            if(!query) {
                alert("Lütfen bir şeyler yazın!");
                return;
            }
            let url = `https://www.youtube.com/results?search_query=${encodeURIComponent(query)}`;
            window.location.href = url;
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                openYouTube();
            }
        });
    </script>
</body>
</html>
