<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CepMelodi</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; min-height: 100vh; padding-bottom: 90px; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .logo { font-size: 22px; font-weight: bold; display: flex; align-items: center; gap: 8px; color: #00f2fe; }
        
        .search-box { padding: 0 20px; margin-bottom: 20px; display: flex; gap: 10px; }
        .search-box input { flex: 1; padding: 12px 18px; border-radius: 25px; border: none; background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; outline: none; }
        .search-box input::placeholder { color: #aaa; }
        .search-box button { background: #00f2fe; border: none; color: #0f0c29; padding: 0 20px; border-radius: 25px; font-weight: bold; cursor: pointer; }

        .section-title { padding: 0 20px; font-size: 18px; margin-bottom: 12px; font-weight: 600; }

        .music-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
        .music-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.07); padding: 10px 15px; border-radius: 12px; transition: 0.2s; }
        .music-info { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
        .music-thumb { width: 55px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #222; }
        .music-details { min-width: 0; }
        .music-details h4 { font-size: 14px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .music-details p { font-size: 12px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .music-actions { display: flex; gap: 8px; flex-shrink: 0; }
        button.action-btn { background: none; border: none; color: #fff; cursor: pointer; font-size: 18px; padding: 6px; border-radius: 50%; transition: 0.2s; }
        button.action-btn:hover { background: rgba(255,255,255,0.1); }
        button.download-btn { color: #00f2fe; }
        button.delete-btn { color: #ff4757; }

        .page { display: none; }
        .page.active { display: block; }

        .sub-header { display: flex; align-items: center; gap: 15px; padding: 20px; }
        .back-btn { background: rgba(255,255,255,0.1); border: none; color: #fff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 5px; }

        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 12, 41, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        nav button { background: none; border: none; color: #aaa; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; transition: 0.2s; }
        nav button.active { color: #00f2fe; }
        nav button span { font-size: 18px; }

        .player-box { position: fixed; bottom: 65px; left: 10px; right: 10px; background: #1f1b42; padding: 10px 15px; border-radius: 12px; display: none; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.1); z-index: 99; }
        .player-box.show { display: flex; }
    </style>
</head>
<body>

    <!-- 1. ANA SAYFA & ARAMA -->
    <div id="home-page" class="page active">
        <header>
            <div class="logo">🎵 CepMelodi</div>
        </header>

        <div class="search-box">
            <input type="text" id="searchInput" placeholder="İstediğin şarkıyı veya sanatçıyı yaz...">
            <button onclick="searchMusic()">Ara</button>
        </div>

        <div class="section-title">Arama Sonuçları</div>
        <div class="music-list" id="home-music-list">
            <p style="text-align:center; color:#aaa; margin-top:20px;">Dinlemek istediğin müziği yukarıya yazıp aratabilirsin.</p>
        </div>
    </div>

    <!-- 2. MÜZİKLERİM (İNDİRİLENLER) PENCERESİ -->
    <div id="downloads-page" class="page">
        <div class="sub-header">
            <button class="back-btn" onclick="goHome()">⬅️ Geri Dön</button>
            <h2>İndirilen Müziklerim</h2>
        </div>
        <div class="music-list" id="downloaded-music-list"></div>
    </div>

    <!-- OYNATICI ALANI -->
    <div class="player-box" id="playerBox">
        <div class="music-info">
            <div class="music-details">
                <h4 id="player-title">Şarkı Seçilmedi</h4>
                <p id="player-artist">CepMelodi</p>
            </div>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <audio id="audioElement" controls style="height:35px; max-width:200px;"></audio>
            <button class="action-btn" onclick="stopMusic()">⏹️</button>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <nav>
        <button id="nav-home" class="active" onclick="goHome()">
            <span>🏠</span> Ana Sayfa
        </button>
        <button id="nav-downloads" onclick="openDownloads()">
            <span>📂</span> Müziklerim
        </button>
    </nav>

    <script>
        let currentAudio = document.getElementById('audioElement');

        function goHome() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('home-page').classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-home').classList.add('active');
        }

        function openDownloads() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('downloads-page').classList.add('active');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('nav-downloads').classList.add('active');
            loadDownloadedList();
        }

        // YouTube / Müzik Kaynaklı Arama Motoru
        async function searchMusic() {
            let query = document.getElementById('searchInput').value.trim();
            let listContainer = document.getElementById('home-music-list');
            
            if (!query) {
                alert("Lütfen aramak istediğiniz şarkı adını girin.");
                return;
            }

            listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">Aranıyor...</p>';

            try {
                // Invidious / Kamuoyuna açık YouTube API alternatifi üzerinden arama yapıyoruz
                let response = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query)}&filter=videos`);
                let data = await response.json();

                listContainer.innerHTML = '';

                let items = data.items || data;
                if (!items || items.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">Hiçbir sonuç bulunamadı.</p>';
                    return;
                }

                // Sadece müzik/video sonuçlarını listele
                let results = items.filter(item => item.type === 'video').slice(0, 15);

                if (results.length === 0) {
                    listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:20px;">Müzik bulunamadı.</p>';
                    return;
                }

                results.forEach(video => {
                    let title = video.title.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    let uploader = (video.uploaderName || 'Sanatçı').replace(/'/g, "\\'");
                    let videoId = video.videoId;
                    let thumb = video.thumbnail || '';
                    
                    // Doğrudan ses akışı sağlayacak güvenli bağlantı
                    let streamUrl = `https://pipedproxy.kavin.rocks/videoplayback?id=${videoId}&itag=140`;

                    listContainer.innerHTML += `
                        <div class="music-item">
                            <div class="music-info">
                                <img class="music-thumb" src="${thumb}" alt="">
                                <div class="music-details">
                                    <h4>${video.title}</h4>
                                    <p>${uploader} • ${formatDuration(video.duration)}</p>
                                </div>
                            </div>
                            <div class="music-actions">
                                <button class="action-btn" onclick="playMusic('${title}', '${uploader}', '${streamUrl}')">▶️</button>
                                <button class="action-btn download-btn" onclick="downloadMusic('${title}', '${uploader}', '${streamUrl}', '${thumb}')">📥</button>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                listContainer.innerHTML = '<p style="text-align:center; color:#ff4757; margin-top:20px;">Arama sırasında bir bağlantı sorunu oluştu.</p>';
            }
        }

        function formatDuration(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchMusic();
            }
        });

        function playMusic(title, artist, url) {
            currentAudio.src = url;
            currentAudio.play();
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-artist').innerText = artist;
            document.getElementById('player-box').classList.add('show');
        }

        function stopMusic() {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            document.getElementById('player-box').classList.remove('show');
        }

        // İndirme (Telefon hafızasına / LocalStorage'a kaydetme)
        function downloadMusic(title, artist, url, thumb) {
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            
            if (!downloads.some(song => song.title === title)) {
                downloads.push({ title, artist, url, thumb });
                localStorage.setItem('cepMelodiDownloads', JSON.stringify(downloads));
                alert(`"${title}" başarıyla indirildi! "Müziklerim" sekmesinden internetsiz dinleyebilirsin.`);
            } else {
                alert("Bu şarkı zaten indirilenlerde var.");
            }
        }

        // İndirilenleri Listeleme
        function loadDownloadedList() {
            let listContainer = document.getElementById('downloaded-music-list');
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            
            listContainer.innerHTML = '';

            if (downloads.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; color:#aaa; margin-top:30px;">Henüz indirilen müzik yok.</p>';
                return;
            }

            downloads.forEach((song, index) => {
                listContainer.innerHTML += `
                    <div class="music-item">
                        <div class="music-info">
                            <img class="music-thumb" src="${song.thumb}" alt="">
                            <div class="music-details">
                                <h4>${song.title}</h4>
                                <p>${song.artist}</p>
                            </div>
                        </div>
                        <div class="music-actions">
                            <button class="action-btn" onclick="playMusic('${song.title}', '${song.artist}', '${song.url}')">▶️</button>
                            <button class="action-btn delete-btn" onclick="removeDownload(${index})">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        function removeDownload(index) {
            let downloads = JSON.parse(localStorage.getItem('cepMelodiDownloads')) || [];
            downloads.splice(index, 1);
            localStorage.setItem('cepMelodiDownloads', JSON.stringify(downloads));
            loadDownloadedList();
        }
    </script>
</body>
</html>
